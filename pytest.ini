[pytest]
testpaths = tests
base_url = http://127.0.0.1:8080
addopts =
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html reports/report.html
    --self-contained-html
    -ra
markers =
    smoke: fast checks that the app is up and the core path works
    api: tests that talk to the HTTP API directly, no browser
    ui: end-to-end tests that drive the browser
    known_defect: documents a confirmed bug (see BUG_REPORTS.md); expected to fail until fixed
xfail_strict = true
